<!DOCTYPE html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="./src/css/reset.css" />
    <link rel="stylesheet" href="./src/css/style.css" />
    <script src="https://unpkg.com/lucide@latest"></script>
    <title>Lista de Produtos</title>
  </head>
  <body>
    <header id="filtersContainer">
      <div id="filters">
        <button id="buttonFullItens" class="generalButtonsHeader">Todos</button>
        <button id="buttonHortifruti" class="generalButtonsHeader">
          Hortifruti
        </button>
        <button id="buttonLaticinio" class="generalButtonsHeader">
          Laticinio
        </button>
      </div>

    </header>
    <main>
      <div id="containerListProducts">
        <ul id="productList"></ul>
      </div>
    </main>

    <aside class="cart">
      <div id="containerProductsCart">
        <h2>Carrinho de produtos</h2>
        <ul class="listproductsCart"></ul>
        <div class="ContainerTotalPrice">
          <p>TOTAL: R$<span id="precoTotal">0,00</span></p>
        </div>
      </div>
    </aside>
  
    <button
      class="cartButton"
      id="ButtonOpenProdcutsCart"
      aria-label="Abrir carrinho"
    >
      🛒 <span class="cart-badge" id="cartBadge">0</span>
    </button>

    <div class="modalContainer" id="modalCartProducts" style="display: none">
      <div class="modal">
        <div class="modalHeader">
          <h3 class="modalTitle" id="cartTitle">Carrinho de Produtos</h3>
          <button class="close-btn" id="closeModal" aria-label="Fechar">
            ✕
          </button>
        </div>
        <div class="modalBody" id="cartBody">
          <ul class="listproductsCartModal"></ul>
        </div>
        <div class="modalFooter">
          <div class="total">TOTAL: R$ 0,00</div>
          <div style="display: flex; gap: 8px">
            <button class="btn-secondary" id="continueShopping">
              Continuar comprando
            </button>
          </div>
        </div>
      </div>
    </div>
    <script src="src/js/script.js"></script>
    <script>
      lucide.createIcons();
    </script>
  </body>
</html>
